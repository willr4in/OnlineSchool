[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-lab"
version = "0.2.0"
description = "ЛР 1: приём сдач онлайн-школы и расширяемые анализаторы (траектория Backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[project.scripts]
school-lab = "school_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
school_lab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["school_lab"]
known-local-folder = ["conftest", "test_validation"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
